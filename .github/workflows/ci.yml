# CI：三平台质量门禁 + 前端构建验证（Windows / Linux / macOS）
# 触发：仅手动 —— Actions 页面 → CI → Run workflow（不再随 push / PR 自动执行）
#
# 分工：
#   quality-gate  — JS 侧质量门禁（typecheck + lint + 单测），三平台并行
#   frontend-build — 前端产物构建（tsc + vite build），三平台并行
# Rust 后端编译 / 完整打包由 release.yml 在打 tag 时执行
# E2E 需要真实 Tauri 窗口 + WebView2，不适合纯 CI，仍在本机 `npm run tauri dev` 存活时执行
#
# 注意：npm 版本必须与本地一致（npm@11.6.1）。本地 lock 由 npm 11 生成，
#   npm 10 严格校验会报 "Missing: esbuild@0.28.2 from lock file"（npm 已知 bug，见
#   https://github.com/npm/cli/issues/8805）。两 job 均在 npm ci 前钉定版本。

name: CI

on:
  workflow_dispatch:

# 同一次 push / PR 有新提交到达时取消旧运行，节省 Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- JS 侧质量门禁：三平台并行 ----
  quality-gate:
    name: quality-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 与本地 npm 版本对齐，避免 npm 10/11 对 lock 校验不一致导致 npm ci 失败
      - name: Pin npm version
        run: npm install -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  # ---- 前端产物构建验证：三平台并行 ----
  frontend-build:
    name: frontend-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 与本地 npm 版本对齐，避免 npm 10/11 对 lock 校验不一致导致 npm ci 失败
      - name: Pin npm version
        run: npm install -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build
