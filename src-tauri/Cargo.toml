[package]
name = "oneflower"
version = "0.1.0"
description = "One Flower"
edition = "2021"

[lib]
name = "oneflower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled 自带 SQLite 并启用 FTS5
rusqlite = { version = "0.32", features = ["bundled"] }
# keytar 的 Rust 等价物：OS keychain（Windows 凭据管理器 / macOS Keychain / Linux Secret Service）
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# Skill 目录文件监听（热重载）
notify = "6"
dirs = "5"

[profile.dev]
opt-level = 0
debug = 1
